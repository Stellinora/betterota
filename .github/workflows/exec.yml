name: Build Kam Module

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create GitHub release and upload artifacts
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub release as a pre-release
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: kam-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KAM_PRIVATE_KEY_AVAILABLE: ${{ secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      KAM_SIGN_ENABLED: ${{ (inputs.release == true || github.ref_type == 'tag') && secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      KAM_SIGN_REQUIRED: ${{ (inputs.release == true || github.ref_type == 'tag') && secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      KAM_CHANGELOG_ENABLED: '0'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@v3
        with:
          github-token: ${{ github.token }}
          enable-cache: 'true'
          cache-targets: kam
          install-commitizen: 'false'
          private-key: ${{ secrets.KAM_PRIVATE_KEY }}

      - name: Install artifact tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          kam --version
          gh --version

      - name: Build module
        shell: bash
        run: |
          set -euo pipefail
          find hooks src -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          rm -rf dist
          kam build

      - name: Verify artifact contents
        shell: bash
        run: |
          set -euo pipefail
          zipfile="$(ls dist/*.zip | head -n1)"
          test -n "$zipfile"
          test -f "$zipfile"
          unzip -Z1 "$zipfile" | grep -Fx 'module.prop'
          ! unzip -Z1 "$zipfile" | grep -E '(^|/)\.git($|/)'

      - name: Resolve release tag
        if: ${{ inputs.release == true || github.ref_type == 'tag' }}
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "KAM_RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Export update metadata
        if: ${{ inputs.release == true || github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          kam export update dist/update.json
          zipname="$(basename "$(ls dist/*.zip | head -n1)")"
          sed -i "s#/download/[^/\"]*\.zip#/download/${zipname}#" dist/update.json
          grep -q "/download/${zipname}\"" dist/update.json

      - name: Create GitHub release
        if: ${{ inputs.release == true || github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          release_title="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' kam.toml | head -n1)"
          args=(--all-assets --title "$release_title")
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          kam publish "${args[@]}"

      - name: Upload build artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: kam-module-artifact
          path: dist/*
          if-no-files-found: error
